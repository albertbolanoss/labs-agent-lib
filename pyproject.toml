[project]
name = "labs-agent-lib"
version = "0.1.0"
description = "Shared utilities (settings, logging, document text extraction, Claude Agent SDK environment) for Claude-agent-based projects."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Luis Alberto Bolaños Salazar", email = "68343185+albertbolanoss@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "docx2txt>=0.9",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-docx>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=labs_agent_lib --cov-report=term-missing"

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "if __name__ == .__main__.:",
]
